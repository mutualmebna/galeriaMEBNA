<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galería - Cepas de Junín</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --negro:#0B0B0A;
    --blanco:#F7F5F1;
    --arena:#B9AE9B;
    --linea:rgba(247,245,241,0.18);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{
    background:var(--negro);
    color:var(--blanco);
    font-family:'Inter',sans-serif;
    overflow:hidden;
  }

  /* ---------- TOP BAR (mínima) ---------- */
  .topbar{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:center;
    padding:22px 4vw;
    z-index:50;
    font-size:0.78rem;
    letter-spacing:0.02em;
    color:var(--blanco);
    pointer-events:none;
  }
  .topbar span{opacity:0.8;}
  .topbar .counter{font-variant-numeric:tabular-nums;}

  /* ---------- MAIN STAGE ---------- */
  .stage{
    position:relative;
    height:100vh;
    width:100vw;
  }
  .slide{
    position:absolute;
    inset:0;
    opacity:0;
    visibility:hidden;
    transition:opacity 1s cubic-bezier(.22,.61,.36,1);
  }
  .slide.active{
    opacity:1;
    visibility:visible;
    z-index:1;
  }
  .slide img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    transform:scale(1.06);
    transition:transform 6s cubic-bezier(.22,.61,.36,1);
  }
  .slide.active img{
    transform:scale(1);
  }
  .slide::after{
    content:'';
    position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 72%, rgba(0,0,0,0.55) 100%);
    pointer-events:none;
  }

  /* caption, chico y abajo a la izquierda */
  .slide-caption{
    position:absolute;
    left:4vw;bottom:6vh;
    z-index:2;
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .slide-caption .proyecto{
    font-family:'Fraunces',serif;
    font-weight:400;
    font-size:1.4rem;
  }
  .slide-caption .detalle{
    font-size:0.78rem;
    color:var(--arena);
  }

  /* ---------- ARROWS ---------- */
  .nav-arrow{
    position:absolute;
    top:0;bottom:0;
    width:14%;
    display:flex;align-items:center;
    z-index:10;
    cursor:pointer;
    background:transparent;
    border:none;
  }
  .nav-arrow.prev{left:0;justify-content:flex-start;padding-left:2vw;}
  .nav-arrow.next{right:0;justify-content:flex-end;padding-right:2vw;}
  .nav-arrow svg{
    width:22px;height:22px;
    opacity:0;
    transition:opacity .3s ease, transform .3s ease;
    stroke:var(--blanco);
  }
  .nav-arrow:hover svg{opacity:0.85;}
  .nav-arrow.prev:hover svg{transform:translateX(-4px);}
  .nav-arrow.next:hover svg{transform:translateX(4px);}

  /* ---------- PROGRESS DOTS BY PROJECT ---------- */
  .progress{
    position:fixed;
    left:4vw;top:50%;
    transform:translateY(-50%);
    display:flex;flex-direction:column;gap:10px;
    z-index:50;
  }
  .progress button{
    width:5px;height:5px;
    border-radius:50%;
    border:none;
    background:var(--linea);
    cursor:pointer;
    transition:background .3s ease, transform .3s ease;
    padding:0;
  }
  .progress button.active{
    background:var(--blanco);
    transform:scale(1.6);
  }

  /* ---------- FILMSTRIP (abajo, minimal) ---------- */
  .filmstrip{
    position:fixed;
    bottom:0;left:0;right:0;
    display:flex;
    gap:6px;
    padding:0 4vw 0;
    height:4px;
    z-index:50;
  }
  .filmstrip .seg{
    flex:1;
    background:var(--linea);
    position:relative;
    overflow:hidden;
  }
  .filmstrip .seg .fill{
    position:absolute;left:0;top:0;bottom:0;
    width:0%;
    background:var(--blanco);
  }
  .filmstrip .seg.done .fill{width:100%;}

  /* ---------- INTRO OVERLAY ---------- */
  .intro-overlay{
    position:fixed;inset:0;
    background:var(--negro);
    z-index:200;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:28px;
    text-align:center;
    transition:opacity .9s ease, visibility .9s ease;
  }
  .intro-overlay.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  .intro-overlay h1{
    font-family:'Fraunces',serif;
    font-weight:300;
    font-size:clamp(1.8rem,4vw,3rem);
    max-width:16ch;
    line-height:1.15;
  }
  .intro-overlay p{
    font-size:0.82rem;
    color:var(--arena);
    max-width:40ch;
  }
  .enter-btn{
    margin-top:10px;
    border:1px solid var(--linea);
    color:var(--blanco);
    background:transparent;
    padding:14px 30px;
    border-radius:100px;
    font-size:0.85rem;
    cursor:pointer;
    transition:background .3s ease, color .3s ease;
  }
  .enter-btn:hover{background:var(--blanco);color:var(--negro);}
  /* Selector rápido de secciones */
.project-shortcuts {
  position: fixed;
  top: 22px;
  right: 4vw;
  display: flex;
  gap: 8px;
  z-index: 60;
}
.shortcut-btn {
  background: rgba(247, 245, 241, 0.08);
  border: 1px solid var(--linea);
  color: var(--blanco);
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  text-decoration: none;
  backdrop-filter: blur(8px);
  cursor: pointer;
  transition: all 0.3s ease;
}
.shortcut-btn:hover,
.shortcut-btn.active {
  background: var(--blanco);
  color: var(--negro);
  border-color: var(--blanco);
}

/* Ajuste del contador para convivir con los botones */
.topbar {
  max-width: 50vw; /* evita solapamiento en pantallas medianas */
}

@media (max-width: 720px) {
  .project-shortcuts {
    top: auto;
    bottom: 24px;
    right: auto;
    left: 6vw;
  }
}

  /* ---------- END SLIDE (contacto) ---------- */
  .slide.end-slide{
    background:var(--negro);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .slide.end-slide .end-inner{
    text-align:center;
    display:flex;flex-direction:column;gap:22px;align-items:center;
  }
  .end-inner h2{
    font-family:'Fraunces',serif;
    font-weight:300;
    font-size:clamp(1.6rem,4vw,2.6rem);
    max-width:16ch;
  }
  .end-inner a{
    color:var(--negro);
    background:var(--blanco);
    text-decoration:none;
    padding:14px 30px;
    border-radius:100px;
    font-size:0.85rem;
  }

  @media (max-width:720px){
    .slide-caption{left:6vw;bottom:9vh;}
    .progress{left:6vw;}
    .filmstrip{padding:0 6vw;}
    .nav-arrow{width:22%;}
  }
</style>
</head>
<body>

<div class="intro-overlay" id="intro">
  <h1>Recorré nuestros desarrollos</h1>
  <p>Una galería para caminar cada proyecto como si estuvieras ahí. Usá las flechas o tocá los costados para avanzar.</p>
  <button class="enter-btn" id="enterBtn">Entrar a la galería</button>
</div>

<div class="topbar">
  <span id="projectName">Cepas de Junín</span>
  <span class="counter" id="counter">01 / 11</span>
</div>
<nav class="project-shortcuts" id="shortcuts" aria-label="Accesos directos a secciones"></nav>
<div class="progress" id="progress"></div>

<div class="stage" id="stage">
  <!-- Slides insertados por JS -->
  <button class="nav-arrow prev" id="prevBtn" aria-label="Anterior">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <button class="nav-arrow next" id="nextBtn" aria-label="Siguiente">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>
  </button>
</div>

<div class="filmstrip" id="filmstrip"></div>

<script>
const proyectos = [
  {
    id: "loteo",
    nombre: "Cepas de Junín",
    labelNav: "Loteo",
    ubicacion: "Carril del centro entre Santos Lugares y Olivares, Junín",
    fotos: [
      { src: "imagenes/cepasdejunin/IMG_6639.JPG", detalle: "Entrada" },
      { src: "imagenes/cepasdejunin/IMG_6629.JPG", detalle: "Garita - Entrada" },
      { src: "imagenes/cepasdejunin/IMG_6707.JPG", detalle: "" },
      { src: "imagenes/cepasdejunin/IMG_6708.JPG", detalle: "" },
    ]
  },
  {
    id: "duplex",
    nombre: "Cepas de Junín - Dúplex",
    labelNav: "Dúplex",
    ubicacion: "Carril del centro entre Santos Lugares y Olivares, Junín",
    fotos: [
      { src: "imagenes/duplex-cepas/IMG-20260813-WA0097.jpg", detalle: "Vista exterior frontal" },
      { src: "imagenes/duplex-cepas/IMG-20260813-WA0078 (1).jpg", detalle: "Interior planta baja" },
      { src: "imagenes/duplex-cepas/IMG-20260813-WA0083.jpg", detalle: "Entrada trasera" },
      { src: "imagenes/duplex-cepas/IMG-20260813-WA6682.jpg", detalle: "Vista exterior posterior" },
    ]
  },
  {
    id: "casa",
    nombre: "Cepas de Junín - Casa",
    labelNav: "Casa",
    ubicacion: "Carril del centro entre Santos Lugares y Olivares, Junín",
    fotos: [
      { src: "imagenes/casa-cepas/IMG_6662.JPG", detalle: "Fachada exterior" },
      { src: "imagenes/casa-cepas/IMG_6675.JPG", detalle: "Vista diagonal" },
      // Convertir IMG_6670.CR2 a .JPG / .webp para que cargue en el navegador
      { src: "imagenes/casa-cepas/IMG_6670.jpg", detalle: "Vista interior" },
    ]
  }
];

const slidesData = [];
proyectos.forEach((p, pi) => {
  p.fotos.forEach((f, fi) => {
    slidesData.push({ ...f, id: p.id, proyecto: p.nombre, ubicacion: p.ubicacion, projIndex: pi });
  });
});

const stage = document.getElementById('stage');
const progressEl = document.getElementById('progress');
const filmstripEl = document.getElementById('filmstrip');
const projectNameEl = document.getElementById('projectName');
const counterEl = document.getElementById('counter');
const shortcutsEl = document.getElementById('shortcuts');

// Renderizar slides
slidesData.forEach((s, i) => {
  const div = document.createElement('div');
  div.className = 'slide';
  div.dataset.index = i;
  div.innerHTML = `
    <img src="${s.src}" alt="${s.proyecto} - ${s.detalle}">
    <div class="slide-caption">
      <div class="proyecto">${s.proyecto}</div>
      <div class="detalle">${s.detalle ? s.detalle + ' — ' : ''}${s.ubicacion}</div>
    </div>
  `;
  stage.insertBefore(div, document.getElementById('prevBtn'));
});

// Slide final
const endDiv = document.createElement('div');
endDiv.className = 'slide end-slide';
endDiv.dataset.index = slidesData.length;
endDiv.innerHTML = `
  <div class="end-inner">
    <h2>¿Querés recorrer alguno de estos proyectos en persona?</h2>
    <a href="https://wa.me/5492613896838" target="_blank" rel="noopener">Escribinos por WhatsApp</a>
  </div>
`;
stage.insertBefore(endDiv, document.getElementById('prevBtn'));

const totalSlides = slidesData.length + 1;

// Generar accesos rápidos (links/píldoras superiores)
proyectos.forEach((p) => {
  const btn = document.createElement('button');
  btn.className = 'shortcut-btn';
  btn.textContent = p.labelNav;
  btn.dataset.id = p.id;
  btn.addEventListener('click', () => {
    const target = slidesData.findIndex(s => s.id === p.id);
    document.getElementById('intro').classList.add('hidden');
    goTo(target);
  });
  shortcutsEl.appendChild(btn);
});

// Puntos de progreso
proyectos.forEach((p, pi) => {
  const dot = document.createElement('button');
  dot.title = p.nombre;
  dot.addEventListener('click', () => {
    goTo(slidesData.findIndex(s => s.projIndex === pi));
  });
  progressEl.appendChild(dot);
});

// Filmstrip
slidesData.forEach(() => {
  const seg = document.createElement('div');
  seg.className = 'seg';
  seg.innerHTML = '<div class="fill"></div>';
  filmstripEl.appendChild(seg);
});

let current = 0;
const allSlides = document.querySelectorAll('.slide');
const dots = document.querySelectorAll('.progress button');
const segs = document.querySelectorAll('.filmstrip .seg');
const shortcutBtns = document.querySelectorAll('.shortcut-btn');

function render(){
  allSlides.forEach((s, i) => s.classList.toggle('active', i === current));

  if(current < slidesData.length){
    const s = slidesData[current];
    projectNameEl.textContent = s.proyecto;
    counterEl.textContent = `${String(current + 1).padStart(2, '0')} / ${String(slidesData.length).padStart(2, '0')}`;
    dots.forEach((d, i) => d.classList.toggle('active', i === s.projIndex));
    shortcutBtns.forEach((b, i) => b.classList.toggle('active', i === s.projIndex));
    history.replaceState(null, '', '#' + s.id);
  } else {
    projectNameEl.textContent = 'Contacto';
    counterEl.textContent = '';
    dots.forEach(d => d.classList.remove('active'));
    shortcutBtns.forEach(b => b.classList.remove('active'));
    history.replaceState(null, '', '#contacto');
  }

  segs.forEach((seg, i) => seg.classList.toggle('done', i <= current && current < slidesData.length));
}

function goTo(i){
  current = Math.max(0, Math.min(totalSlides - 1, i));
  render();
}

// Navegación
document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));
document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));

document.addEventListener('keydown', (e) => {
  if(e.key === 'ArrowRight') goTo(current + 1);
  if(e.key === 'ArrowLeft') goTo(current - 1);
});

// Soporte touch
let touchX = null;
stage.addEventListener('touchstart', (e) => touchX = e.touches[0].clientX);
stage.addEventListener('touchend', (e) => {
  if(touchX === null) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if(dx > 50) goTo(current - 1);
  if(dx < -50) goTo(current + 1);
  touchX = null;
});

document.getElementById('enterBtn').addEventListener('click', () => {
  document.getElementById('intro').classList.add('hidden');
});

// Detección inicial de URL directa (ej: tudominio.com/#duplex o #casa)
const hash = window.location.hash.replace('#', '');
if(hash){
  const matchIndex = slidesData.findIndex(s => s.id === hash);
  if(matchIndex !== -1){
    document.getElementById('intro').classList.add('hidden');
    current = matchIndex;
  }
}

render();

</body>
</html>
